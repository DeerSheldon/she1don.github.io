<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>欢迎</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="card">
    <h1>欢迎光临XD<br>在这里输入你的出厂日期吧<br></h1>
    <input
      id="birthday"
      type="text"
      placeholder="例如：0000"
      autocomplete="off"
    />
    <button id="submit">确认</button>
  </div>

  <!-- achievement modal -->
  <div class="modal-overlay" id="achieveModal">
    <div class="modal-box">
      <div class="modal-badge" id="achieveBadge"></div>
      <div class="modal-title" id="achieveTitle"></div>
      <div class="modal-desc" id="achieveDesc"></div>
      <button class="modal-close" id="achieveClose">知道了</button>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
