<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日快乐</title>
<link rel="stylesheet" href="css/chatroom.css">
</head>
<body>

<div class="page-card">

  <!-- 顶部装饰条 -->
  <div class="top-orange-bar"></div>

  <!-- 标题栏 -->
  <div class="title-bar">留言板</div>

  <!-- 消息展示区 -->
  <div class="chatroom-messages" id="chatroomMessages"></div>

  <!-- 底部输入栏 -->
  <div class="chatroom-input">
    <label for="chatMessage">信息：</label>
    <input type="text" id="chatMessage" placeholder="在此输入留言…">
    <button class="send-btn" id="sendBtn">发送</button>
    <button class="send-btn" id="replayBtn" style="display:none;">再看一遍</button>
  </div>

  <!-- 页脚 -->
  <div class="footer-note">
    建议使用 1024×768 分辨率 · IE 5.0 以上版本浏览器
  </div>

</div>

<script src="js/chatroom.js"></script>
</body>
</html>
